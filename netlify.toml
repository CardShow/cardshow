[build]
  # Substitute Supabase credentials from Netlify environment variables into HTML files.
  # Set SUPABASE_URL and SUPABASE_ANON_KEY in Netlify dashboard → Site settings → Environment variables.
  command = "sed -i \"s|SUPABASE_URL_PLACEHOLDER|$SUPABASE_URL|g\" app.html show.html seller-browse.html trade-zone.html trade-board.html && sed -i \"s|SUPABASE_ANON_KEY_PLACEHOLDER|$SUPABASE_ANON_KEY|g\" app.html show.html seller-browse.html trade-zone.html trade-board.html"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Supabase anon/publishable keys are intentionally public — safe to appear in
  # built HTML files. Tell Netlify's secrets scanner to skip these two keys.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

# Trade Zone: hourly expiry sweep — flips stale trade_posts rows to
# 'expired' 1 day after their show's ends_at (never deletes rows).
[functions."expire-trade-posts"]
  schedule = "@hourly"

# Marketplace: return expired listing holds to sale (no-op unless MARKETPLACE_ENABLED=true).
[functions."expire-listing-reservations"]
  schedule = "*/5 * * * *"

# Marketplace Phase 1: card pricing (match new listings, refresh due values, on-demand first),
# nightly refresh priorities, hourly saved-search emails. All no-ops unless MARKETPLACE_ENABLED=true.
[functions."refresh-card-values"]
  schedule = "*/5 * * * *"

[functions."recalc-pricing-priorities"]
  schedule = "17 9 * * *"

[functions."saved-search-alerts"]
  schedule = "@hourly"

# Show status follows the dates: Upcoming → Active (Live) → Past.
[functions."refresh-show-statuses"]
  schedule = "@hourly"

# Show Home: write the show_end inventory snapshot once a show's last day is over.
[functions."close-show-snapshots"]
  schedule = "@hourly"

# GTCR: hourly batch of the daily Trust Check recheck — every unsold graded
# card is re-checked about once a day so the buyer GTCR badge never lapses.
[functions."gtcr-daily-recheck"]
  schedule = "@hourly"

# Disable pretty URLs globally — prevents Netlify from redirecting
# show.html → /show which strips the URL hash fragment containing
# the show inventory payload.
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

# Social Sale Ingestion: hourly re-kick of any stage with waiting work,
# daily evidence purge (D4), weekly Instagram hashtag slot plan.
[functions."social-pipeline-sweep"]
  schedule = "@hourly"

[functions."purge-social-evidence"]
  schedule = "@daily"

[functions."social-slot-planner"]
  schedule = "@weekly"

# Instagram Social Ingest: posts that tag @cardshow.io, every 3 hours, and a
# weekly check that approved Instagram posts are still up (Mondays 08:00 UTC).
[functions."ig-tags-collector"]
  schedule = "0 */3 * * *"

[functions."social-source-check"]
  schedule = "0 8 * * 1"
