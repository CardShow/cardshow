# Buyer site (a separate Netlify site with base directory "buyer").
# Environment: SUPABASE_URL, SUPABASE_ANON_KEY (public key; RLS + the public listing functions decide what's
# readable), MARKETPLACE_SITE_URL (default https://getcardshow.com), BUYER_SITE_INDEXING=true once launched.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify Image CDN: the buyer site's grid tiles load resized dealer photos from /.netlify/images.
# getcardshow.com serves those requests itself (this file and buyer/netlify.toml both allow the source).
[images]
  remote_images = ["https://qtnqawqlmttogwnjieky\\.supabase\\.co/storage/v1/object/public/listing-photos/.*"]
