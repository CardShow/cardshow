# Buyer site (a separate Netlify site with base directory "buyer").
# Environment: SUPABASE_URL, SUPABASE_ANON_KEY (public key; RLS + the public listing functions decide what's
# readable), MARKETPLACE_SITE_URL (default https://getcardshow.com), BUYER_SITE_INDEXING=true once launched.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
